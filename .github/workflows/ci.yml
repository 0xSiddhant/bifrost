name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Backup smoke test
        env:
          HEIMDALL_PIN: ci-smoke-pin
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          npm run setup           # storage folders + migrations => a real app.db
          npm run backup          # VACUUM INTO + zip storage/ + themes/
          ls "$BACKUP_DIR"/bifrost-backup-*.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the Linux image on every PR to keep the Dockerfile honest.
      # Nothing runs it on the Mac (native PM2/launchd is the run mode).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bifrost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
