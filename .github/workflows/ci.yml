name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PLAN-37: server/src/openapi-compat.test.ts diffs the spec against
      # develop's, so develop must be here; the test fails rather than skips
      # in CI when it is not.
      - name: Fetch develop
        run: git fetch --no-tags --depth=1 origin develop:refs/remotes/origin/develop

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # PLAN-35: the standalone site, for the Playwright `standalone` project.
      # Its postbuild step fails the job if the bundle can reach a server.
      - name: Build standalone
        run: npm run build:standalone

      # PLAN-32a: the end-to-end safety net runs against the build above —
      # the production server, the built client in real browsers (Chromium
      # desktop + mobile, WebKit for the household's iOS devices), and the
      # packed CLI installed into a temporary prefix.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
        working-directory: e2e

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
        working-directory: e2e

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Backup smoke test
        env:
          HEIMDALL_PIN: ci-smoke-pin
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          npm run setup           # storage folders + migrations => a real app.db
          npm run backup          # VACUUM INTO + zip storage/
          ls "$BACKUP_DIR"/bifrost-backup-*.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PLAN-39: one image per process, each built on every PR so no
      # Dockerfile can rot. Nothing runs the API image on the Mac (native
      # PM2/launchd is its run mode there).
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: bifrost-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web host image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: bifrost-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # PLAN-35: the standalone site's image, built and run the way
      # compose/standalone.yml runs it, then smoke-tested.
      - name: Build standalone image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/standalone.Dockerfile
          push: false
          load: true
          tags: bifrost-standalone:ci
          cache-from: type=gha,scope=standalone
          cache-to: type=gha,mode=max,scope=standalone

      # Every way of combining the compose files (docs/docker-linux.md,
      # docs/docker-mac.md) must still parse, with paths that resolve.
      - name: Validate compose combinations
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile observability config -q
          docker compose -f compose/api.yml --env-file .env config -q
          docker compose -f compose/web.yml --env-file .env config -q
          docker compose -f compose/web.yml -f compose/web.bridge.yml --env-file .env config -q
          docker compose -f compose/observability.yml --env-file .env --profile observability config -q
          BIFROST_DOCKER_NETWORK=proxy docker compose -f compose/standalone.yml --env-file .env config -q

      - name: Standalone smoke test
        run: scripts/standalone-smoke.sh bifrost-standalone:ci
