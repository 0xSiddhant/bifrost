name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # PLAN-32a: the end-to-end safety net runs against the build above —
      # the production server, the built client in real browsers (Chromium
      # desktop + mobile, WebKit for the household's iOS devices), and the
      # packed CLI installed into a temporary prefix.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
        working-directory: e2e

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
        working-directory: e2e

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Backup smoke test
        env:
          HEIMDALL_PIN: ci-smoke-pin
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          npm run setup           # storage folders + migrations => a real app.db
          npm run backup          # VACUUM INTO + zip storage/ + themes/
          ls "$BACKUP_DIR"/bifrost-backup-*.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the Linux image on every PR to keep the Dockerfile honest.
      # Nothing runs it on the Mac (native PM2/launchd is the run mode).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bifrost:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
