name: CI

# Every job runs in parallel. Before, one job ran checks, build and every
# e2e suite in a row (~17 min, the browser suite alone 9.5 of them); the wall
# clock is now the slowest job.

on:
  pull_request:
    branches: [develop, main]
  push:
    # develop: a run there saves the npm and Playwright caches at develop's
    # scope, which every PR into develop restores. A cache a PR run saves is
    # visible to that PR alone, so every new PR used to install everything
    # cold. It also checks the squash-merged result.
    #
    # Not main: code only reaches main through a PR, which already ran all of
    # this, and a push there re-tests a tree identical to develop's twice per
    # release (the merge, then release.yml's chore(release) commit). The cost
    # is that a release PR, which can read only main's caches, installs cold.
    branches: [develop]

# A new push makes the PR's running CI moot; a branch push always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `changes` reads the list of changed files from the API; nothing else here
# uses the token.
permissions:
  contents: read
  pull-requests: read

jobs:
  # A change to documentation only (Markdown, docs/, .agents/, .claude/) builds
  # and tests nothing (owner, 2026-11-27): every other job waits for this one
  # and is skipped when it says `code=false`. scripts/ci-changes.sh decides,
  # and runs everything whenever the list cannot be had.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci-changes.sh
          sparse-checkout-cone-mode: false

      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          files=''
          if [ -n "$PR" ]; then
            # The API lists at most 3,000 files; a longer list is not trusted.
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || files=''
            [ "$(printf '%s\n' "$files" | wc -l)" -lt 3000 ] || files=''
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # A push: compare lists at most 300 files.
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || files=''
            [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ] || files=''
          fi
          printf '%s\n' "$files"
          printf '%s\n' "$files" | sh scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  checks:
    name: checks (audit, lint, typecheck, backup)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # A known vulnerability at any severity fails the PR (.agents/rules/
      # coding.md, "Dependencies"). New advisories land without a code change,
      # so audit.yml also checks every day.
      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Backup smoke test
        env:
          HEIMDALL_PIN: ci-smoke-pin
        run: |
          npm run setup           # storage folders + migrations => a real app.db
          npm run backup -- --out "$RUNNER_TEMP/backups"   # VACUUM INTO + zip storage/
          ls "$RUNNER_TEMP"/backups/bifrost-backup-*.zip

  # `npm test` split over two machines: the server's suite is about half of it.
  # Together the two run every workspace's tests and scripts/ (scripts/ci.test.ts
  # holds them to that).
  unit:
    name: unit (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            workspaces: server
          - name: client, cli, web, e2e, scripts
            workspaces: client cli web e2e
            scripts: true
    steps:
      - uses: actions/checkout@v4

      # PLAN-37: server/src/openapi-compat.test.ts diffs the spec against
      # develop's, so develop must be here; the test fails rather than skips
      # in CI when it is not.
      - name: Fetch develop
        if: contains(matrix.workspaces, 'server')
        run: git fetch --no-tags --depth=1 origin develop:refs/remotes/origin/develop

      - uses: ./.github/actions/setup

      - name: Test
        run: |
          for workspace in ${{ matrix.workspaces }}; do
            npm test -w "$workspace"
          done

      - name: Test scripts/
        if: matrix.scripts
        run: npx vitest run --dir scripts

  # PLAN-32a/33: the out-of-process suites, against the build: the packed CLI
  # installed into a temporary prefix, and the black-box API suite with its
  # coverage report. No browser.
  e2e-cli-api:
    name: e2e (installed CLI + black-box API)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Both clients (hub and standalone, whose postbuild step fails the job if
      # the bundle can reach a server), the API, the web host, the CLI.
      - name: Build
        run: npm run build

      - name: Installed CLI
        run: npm run test:e2e:cli -w e2e

      - name: Black-box API
        run: npm run test:e2e:api -w e2e

  # PLAN-32a: the browser journeys against the build, two shards per Chromium
  # device so no job runs more than about a minute of journeys. WebKit is not
  # run here (owner, 2026-11-27): in this container, with no GPU, it failed
  # journeys for reasons a real iPhone does not have. It runs by hand before a
  # release (`./bifrost test e2e webkit`).
  e2e-ui:
    name: e2e (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Microsoft's Playwright image already holds every browser and its system
    # libraries. Installing them on the runner meant `playwright install-deps`,
    # which fetches WebKit's ~100 packages from Ubuntu's apt mirror on every
    # run, and a slow mirror held a shard for 17–32 minutes before a single
    # test ran. The tag must equal e2e's @playwright/test version
    # (scripts/ci.test.ts). `--user 1001` is the runner's own user, as
    # Playwright's CI docs give it, so the workspace stays writable; the
    # larger shared memory is for Chromium, as they also advise.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    # A shard takes 2–3 minutes with the image pull. Nothing left in it waits
    # on a mirror, so anything still running at 10 is stuck, not slow.
    timeout-minutes: 10
    strategy:
      # Every shard reports: a failure in one says nothing about the others.
      fail-fast: false
      matrix:
        include:
          - name: chromium desktop + standalone 1/2
            id: chromium-desktop-1
            args: --project=chromium-desktop --project=standalone --shard=1/2
          - name: chromium desktop + standalone 2/2
            id: chromium-desktop-2
            args: --project=chromium-desktop --project=standalone --shard=2/2
          - name: chromium mobile 1/2
            id: chromium-mobile-1
            args: --project=chromium-mobile --shard=1/2
          - name: chromium mobile 2/2
            id: chromium-mobile-2
            args: --project=chromium-mobile --shard=2/2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      - name: Browser journeys
        run: npm run test:e2e:ui -w e2e -- ${{ matrix.args }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.id }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PLAN-39: one image per process, each built on every PR so no
      # Dockerfile can rot. Nothing runs the API image on the Mac (native
      # PM2/launchd is its run mode there).
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: bifrost-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web host image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: bifrost-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # PLAN-35: the standalone site's image, built and run the way
      # compose/standalone.yml runs it, then smoke-tested.
      - name: Build standalone image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/standalone.Dockerfile
          push: false
          load: true
          tags: bifrost-standalone:ci
          cache-from: type=gha,scope=standalone
          cache-to: type=gha,mode=max,scope=standalone

      # Every way of combining the compose files (docs/docker-linux.md,
      # docs/docker-mac.md) must still parse, with paths that resolve.
      - name: Validate compose combinations
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f compose/api.otel.yml --profile observability config -q
          docker compose -f compose/api.yml -f compose/api.alone.yml --env-file .env config -q
          docker compose -f compose/web.yml --env-file .env config -q
          docker compose -f compose/web.yml -f compose/web.standalone.yml --env-file .env config -q
          docker compose -f compose/web.yml -f compose/web.bridge.yml --env-file .env config -q
          docker compose -f compose/observability.yml --env-file .env --profile observability config -q
          BIFROST_DOCKER_NETWORK=proxy docker compose -f compose/standalone.yml --env-file .env config -q

      - name: Standalone smoke test
        run: scripts/standalone-smoke.sh bifrost-standalone:ci
