# Bifrost in Docker (PLAN-39): every piece has its own image (docker/) and its
# own compose file (compose/); this file puts the hub's pieces in one project.
# Each service sets its own run shape in `environment:`; .env never does
# (owner, 2026-10-09). `./bifrost docker …` runs every combination below.
#
#   docker compose up -d --build                         # the hub: API + web host
#   docker compose -f docker-compose.yml -f compose/api.otel.yml --profile observability up -d --build
#                                                        # … plus Grafana/Loki/Alloy/Prometheus/Tempo, traces on
#   docker compose -f compose/api.yml -f compose/api.alone.yml --env-file .env up -d          # the API alone
#   docker compose -f compose/web.yml -f compose/web.standalone.yml --env-file .env up -d     # the standalone client alone
#
# Linux hosts (host networking: bifrost.local, real client addresses, the API on
# loopback). On a Mac the API runs natively and only the web host may run here,
# with compose/web.bridge.yml — docs/docker-mac.md. The standalone site for a
# cloud machine is compose/standalone.yml, not part of this project.
#
# Upgrading from the single `bifrost` service (before PLAN-36):
# `docker compose up -d --build --remove-orphans`.
name: bifrost

include:
  - compose/api.yml
  - compose/web.yml
  - compose/observability.yml
