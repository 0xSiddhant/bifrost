# The standalone Bifrost site (PLAN-35): static files and nothing else.
#
# Installed as the nginx-unprivileged image's conf.d/default.conf by the
# Dockerfile's `standalone` target. There is deliberately no proxy_pass
# anywhere: even this web server cannot reach a backend, so the site cannot
# either. Each public page is a real file the build wrote for search engines
# (client/seoBuild.ts): /runestone is runestone/index.html. Every other path
# gets 404.html with a 404 status, so it is never indexed, and the app in it
# still explains itself: a hub-only deep link, /api/…, /go/… or /<kind>/api/…
# shows "The Bifröst is closed", anything else the app's own 404 page.
#
# Two copies of these rules serve dist-standalone/ outside the container:
# e2e/support/static-server.ts (the Playwright `standalone` project) and
# web/src/standalone-rules.ts (`./bifrost start --standalone`, web mode). A
# unit test beside each parses this file and fails if they disagree, so a
# change here is a change to all three.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Compressed on the wire, whether or not a proxy in front compresses too.
    # text/html is always included; fonts and images are compressed already.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
        application/manifest+json image/svg+xml application/wasm text/plain text/xml
        application/xml;

    # Hashed build output: the name changes whenever the content does, so it
    # can be cached forever. A missing chunk is a 404, never the app shell:
    # HTML under a script's name would fail as a confusing MIME error instead
    # of the app's own "reload to update" boundary.
    location /assets/ {
        try_files $uri =404;
        # pdf.js ships its worker as .mjs, which older mime.types do not name.
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The shell is never cached, so a new deploy is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The web app manifest: nginx's type table does not name .webmanifest,
    # and with nosniff a browser would refuse it as octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Icons, pdf.js's wasm, robots.txt and sitemap.xml by name, a public page
    # by its folder's index.html; everything else is 404.html, as a 404.
    location / {
        try_files $uri $uri/index.html =404;
        error_page 404 /404.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
