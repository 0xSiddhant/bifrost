# The standalone Bifrost site (PLAN-35): static files and nothing else.
#
# Installed as the nginx-unprivileged image's conf.d/default.conf by the
# Dockerfile's `standalone` target. There is deliberately no proxy_pass
# anywhere: even this web server cannot reach a backend, so the site cannot
# either. Every path that is not a file lands on the app, which explains
# itself: a deep link opens its page, and /api/…, /go/… or /<kind>/api/…
# shows "The Bifröst is closed".
#
# e2e/support/static-server.ts serves dist-standalone/ with these same rules
# for the Playwright `standalone` project, and a unit test there checks that
# the two agree, so change both together.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Hashed build output: the name changes whenever the content does, so it
    # can be cached forever. A missing chunk is a 404, never the app shell:
    # HTML under a script's name would fail as a confusing MIME error instead
    # of the app's own "reload to update" boundary.
    location /assets/ {
        try_files $uri =404;
        # pdf.js ships its worker as .mjs, which older mime.types do not name.
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The shell is never cached, so a new deploy is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Icons, the web manifest and pdf.js's wasm by name; everything else is
    # the app (deep links survive a refresh).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
