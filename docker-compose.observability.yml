# Optional Grafana + Loki + Alloy stack. DETACHABLE by design — Bifrost never
# depends on it. Logs are files first (storage/logs/), so this can be down for
# weeks and Alloy backfills the whole log when it next starts.
#
# Works whether Bifrost runs native (PM2/launchd) or in Docker — Alloy just
# tails ./storage/logs on the host.
#
#   docker compose -f docker-compose.observability.yml up -d
#   open http://localhost:3000   (admin / bifrost — change it)

services:
  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - '3100:3100'
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.3.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./storage/logs:/var/log/bifrost:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  # Accelerator, never the record: Prometheus SCRAPES, so anything it missed
  # while this stack was down never existed as far as it is concerned. The
  # durable runtime history is the metrics snapshot in storage/logs/, which
  # Alloy backfills from the files (PLAN-16b).
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    # Bifrost runs native on macOS, so the scrape target is the host, not a
    # sibling container. Docker Desktop resolves host.docker.internal already;
    # this keeps the same config working on Linux, where it does not.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

  # Traces. Pushed to, so the least durable of the three signals — see
  # observability/tempo/tempo.yml. OTEL_ENABLED must be true in .env for the app
  # to send anything, and it defaults to false so a dead endpoint never degrades
  # the log archive with retry noise (PLAN-16b).
  tempo:
    image: grafana/tempo:2.6.0
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      # OTLP/HTTP in, and the query API Grafana uses.
      - '4318:4318'
      - '3200:3200'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: bifrost
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - loki
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  loki-data:
  alloy-data:
  grafana-data:
  prometheus-data:
  tempo-data:
