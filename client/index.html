<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <title>Bifrost</title>

    <!-- Favicons: SVG for modern browsers, PNG fallbacks for the rest. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- PWA: installable + "Add to Home Screen" on iOS and Android. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bifrost" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Bifrost" />
    <script>
      // FOUC guard: replay the last applied theme's tokens before first paint.
      // The theme engine reconciles against the server after hydration.
      try {
        var cached = JSON.parse(localStorage.getItem('bifrost.theme.cache') || 'null');
        if (cached && cached.tokens) {
          var root = document.documentElement;
          for (var key in cached.tokens) root.style.setProperty(key, cached.tokens[key]);
          if (cached.mode) root.style.colorScheme = cached.mode;
          if (cached.id) root.setAttribute('data-theme', cached.id);
        }
      } catch (error) {
        /* corrupt cache: stylesheet defaults carry the first paint */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
